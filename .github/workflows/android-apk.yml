# Builds an installable Android APK of the mobile app on every push to feature/app-setup
# (or by hand from the Actions tab), and publishes it as the "latest-apk" pre-release so it
# can be downloaded straight to a phone.
name: Android APK

on:
  push:
    branches: [feature/app-setup]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: |
          npm run typecheck
          npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # The release build is signed with the debug key: fine for testing, not for the Play Store.
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "xapp-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xapp-apk
          path: apps/mobile/xapp-${{ github.run_number }}.apk

      - name: Publish as the latest-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk "xapp-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Xapp test APK #${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On the phone: download the .apk, open it and allow installing from this source."
