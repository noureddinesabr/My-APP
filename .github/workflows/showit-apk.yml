# Builds the "Xapp Show it" test app (apps/showit) into an installable Android APK on every
# push that changes it (or by hand from the Actions tab), and publishes it as the
# "showit-apk" pre-release. It is a separate app (ma.xapp.showit) from the older Xapp APK.
name: Show it APK

on:
  push:
    branches: [feature/app-setup]
    paths: ['apps/showit/**', '.github/workflows/showit-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showit-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/showit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/showit/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # The release build is signed with the debug key: fine for testing, not for the Play Store.
      - name: Build the APK
        working-directory: apps/showit/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "xapp-showit-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xapp-showit-apk
          path: apps/showit/xapp-showit-${{ github.run_number }}.apk

      - name: Publish as the showit-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete showit-apk --yes --cleanup-tag || true
          gh release create showit-apk "xapp-showit-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Xapp Show it test APK #${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On the phone: download the .apk, open it and allow installing from this source. Installs next to the older Xapp test app."
