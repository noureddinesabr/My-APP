# Builds the "Xapp Show it" test app (apps/showit) into an installable Android APK on every
# push that changes it (or by hand from the Actions tab), and publishes it as the
# "showit-apk" pre-release. It is a separate app (ma.xapp.showit) from the older Xapp APK.
name: Show it APK

on:
  push:
    branches: [feature/app-setup]
    paths: ['apps/showit/**', '.github/workflows/showit-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showit-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The owner's Expo access token (GitHub › Settings › Secrets › Actions › EXPO_TOKEN). Without it the
      # APK builds as before, with no automatic updates.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/showit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/showit/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: npm run typecheck

      # Expo updates: link the app to the owner's expo.dev project and switch updates on, so the
      # phones running this APK download later fixes by themselves (runtime = the app version in
      # app.json: bump "version" when a change needs a new APK, e.g. a new native package).
      - name: Link to Expo for updates
        if: env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@latest init --id af285da7-c2a6-468c-8ade-cea582c6498a --non-interactive --force
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.updates.enabled=true;j.expo.updates.url='https://u.expo.dev/'+j.expo.extra.eas.projectId;fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('updates url',j.expo.updates.url)"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # The release build is signed with the debug key: fine for testing, not for the Play Store.
      - name: Build the APK
        working-directory: apps/showit/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "xapp-showit-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xapp-showit-apk
          path: apps/showit/xapp-showit-${{ github.run_number }}.apk

      - name: Publish as the showit-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete showit-apk --yes --cleanup-tag || true
          gh release create showit-apk "xapp-showit-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Xapp Show it test APK #${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On the phone: download the .apk, open it and allow installing from this source. Installs next to the older Xapp test app."

      # The same code goes out as an update: phones with an APK of the same app version get it
      # the next time the app opens (no new APK to install).
      - name: Send the update to phones
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest update --channel production --platform android --message "Build ${{ github.run_number }}" --non-interactive
