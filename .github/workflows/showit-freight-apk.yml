# Builds the second Stitch design (freight & moving) of the Show it app (branch preview/freight) into its own test APK,
# "Xapp Freight" (ma.xapp.showit.freight), published as the "showit-freight-apk" pre-release. It installs
# next to the main test app. Its automatic updates (owner, 19 Nov 2026) go on their own Expo channel,
# "freight", so they never reach the main app (which listens to "production").
name: Xapp Freight APK

on:
  push:
    branches: [preview/freight]
    paths: ['apps/showit/**', '.github/workflows/showit-freight-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showit-freight-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The owner's Expo access token (GitHub › Settings › Secrets › Actions › EXPO_TOKEN).
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/showit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/showit/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the code
        run: npm run typecheck

      # Its own name and package, so it sits next to "Xapp Show it" on the phone, and its own update
      # channel ("freight"): updates sent from this branch reach only Xapp Freight.
      - name: Make it a separate app
        run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.name='Xapp Freight';j.expo.android.package='ma.xapp.showit.freight';j.expo.updates.enabled=false;delete j.expo.updates.url;j.expo.updates.requestHeaders={'expo-channel-name':'freight'};fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log(j.expo.name,j.expo.android.package)"

      # Expo updates: the phones running this APK download later fixes by themselves (runtime = the
      # app version in app.json: bump "version" when a change needs a new APK, e.g. a new native package).
      - name: Link to Expo for updates
        if: env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@latest init --id af285da7-c2a6-468c-8ade-cea582c6498a --non-interactive --force
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.updates.enabled=true;j.expo.updates.url='https://u.expo.dev/'+j.expo.extra.eas.projectId;fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('updates url',j.expo.updates.url,j.expo.updates.requestHeaders)"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Signed with the debug key: fine for testing, not for the Play Store.
      - name: Build the APK
        working-directory: apps/showit/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "xapp-freight-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xapp-freight-apk
          path: apps/showit/xapp-freight-${{ github.run_number }}.apk

      - name: Publish as the showit-freight-apk pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete showit-freight-apk --yes --cleanup-tag || true
          gh release create showit-freight-apk "xapp-freight-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Xapp Freight test APK #${{ github.run_number }}" \
            --notes "Xapp Freight (Stitch freight & moving design) preview, built from ${{ github.sha }}. A separate app (Xapp Freight): it installs next to Xapp Show it, Xapp Simple and Xapp Stitch and does not change it. On the phone: download the .apk, open it and allow installing from this source."

      # The same code goes out as an update on the "freight" channel: phones with this APK (same app
      # version) get it the next time Xapp Freight opens, with no new APK to install.
      - name: Send the update to phones
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest update --channel freight --platform android --message "Freight build ${{ github.run_number }}" --non-interactive
