<style>
/* Layout: one phone at the centre of a steel-blue desk; the waybill (consignment note) rides at the top of every request screen and fills in as you answer. */
:root {
  --desk: #DCE3EA;
  --bg: #F3F6F9;
  --card: #FFFFFF;
  --ink: #0E1A2B;
  --muted: #5A6A7E;
  --line: #D3DCE6;
  --signal: #FFC21A;      /* safety yellow: the one accent, always with ink on it */
  --on-signal: #0E1A2B;
  --route: #1F4FD8;       /* container blue: routes and maps */
  --ok: #0E8A5F;
  --stamp: #C7372F;
  --map: #E6ECF2;
  --map-grid: #D2DBE5;
  --shadow: 0 1px 2px rgba(14,26,43,.06), 0 8px 24px rgba(14,26,43,.08);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #070C15; --bg: #0C1422; --card: #142034; --ink: #E8EEF6; --muted: #93A3B8; --line: #22324A;
  --signal: #FFC21A; --on-signal: #0E1A2B; --route: #6E93FF; --ok: #35C48E; --stamp: #FF6B5E;
  --map: #101B2C; --map-grid: #1A2840; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #070C15; --bg: #0C1422; --card: #142034; --ink: #E8EEF6; --muted: #93A3B8; --line: #22324A;
  --signal: #FFC21A; --on-signal: #0E1A2B; --route: #6E93FF; --ok: #35C48E; --stamp: #FF6B5E;
  --map: #101B2C; --map-grid: #1A2840; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--desk); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
button:focus-visible, input:focus-visible { outline: 2px solid var(--route); outline-offset: 2px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }

/* Desk header */
.desk-head { max-width: 1180px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between }
.brand { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; letter-spacing: .5px }
.brand small { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .4px; margin-left: 8px; font-stretch: 100% }
.views { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.views button { padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted) }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

/* Phone */
.phone { width: 100%; max-width: 390px; height: 780px; max-height: calc(100dvh - 120px); min-height: 600px; margin: 0 auto; background: var(--bg);
  border-radius: 34px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; position: relative; display: flex; flex-direction: column }
@media (max-width: 440px) { .phone { border-radius: 22px } }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0 }
.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px }
.scroll > * { flex-shrink: 0 }
.bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0 }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line) }
.steps { flex: 1; display: flex; gap: 4px }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line) }
.steps i.on { background: var(--ink) }
.foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--bg) }
.cta { width: 100%; min-height: 52px; border-radius: 14px; background: var(--signal); color: var(--on-signal); font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 17px; letter-spacing: .3px; display: flex; align-items: center; justify-content: center; gap: 8px }
.cta[disabled] { background: var(--line); color: var(--muted); cursor: default }
.ghost { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px }
h1, h2 { font-family: var(--display); font-stretch: 80%; font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .2px }
h1 { font-size: 34px; line-height: 1.02 }
h2 { font-size: 24px; line-height: 1.1 }
.sub { color: var(--muted); margin: 0; font-size: 14px }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--muted) }

/* The waybill */
.waybill { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden }
.wb-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px dashed var(--line) }
.wb-top b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 15px; letter-spacing: 1px }
.wb-grid { display: grid; grid-template-columns: 1fr 1fr; }
.wb-cell { padding: 8px 14px; border-bottom: 1px solid var(--line); min-width: 0 }
.wb-cell:nth-child(odd) { border-right: 1px solid var(--line) }
.wb-cell .v { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wb-cell .v.empty { color: var(--line); font-family: var(--mono); font-weight: 400 }
.wb-cell .v.fresh { animation: ink .5s ease-out }
@keyframes ink { from { background: var(--signal); } to { background: transparent } }
.wb-route { grid-column: 1 / -1; border-right: 0 !important; display: flex; align-items: center; gap: 8px }
.wb-route .arrow { color: var(--route); font-family: var(--mono) }
.notch { position: absolute; top: 37px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg) }
.notch.l { left: -7px } .notch.r { right: -7px }

/* Home */
.hero { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden }

.recent { background: var(--card); border-radius: 14px; border: 1px solid var(--line); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; width: 100% }

(() => {

  const KINDS = [

    { id: 'boxes', t: 'Boxes', icon: 'box' },
    { id: 'appliance', t: 'Appliances', icon: 'fridge' },
    { id: 'materials', t: 'Building materials', icon: 'bricks' },

  // Size by what it fits in, not by tonnes: people know that.

  const DRIVERS = [

  const km = (a, b) => {
    const R = 6371, r = (x) => x * Math.PI / 180;
    const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
    return Math.max(4, Math.round(2 * R * Math.asin(Math.sqrt(h)) * 1.3));

  const r10 = (v) => Math.round(v / 10) * 10;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  // ---- Icons (simple strokes) ------------------------------------------
  const P = {
    sofa: '<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M3 11h4v3h10v-3h4v6H3z"/><path d="M5 17v2M19 17v2"/>',

    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',

    if (id === 'car') return `<svg viewBox="0 0 64 30" ${f}><path d="M6 22h52v-6l-8-2-6-7H22l-7 7-9 2z"/><circle cx="18" cy="23" r="4" fill="var(--card)"/><circle cx="46" cy="23" r="4" fill="var(--card)"/></svg>`;
    if (id === 'van') return `<svg viewBox="0 0 64 30" ${f}><path d="M4 23V6h38l10 8h8v9z"/><path d="M42 6v8h10"/><circle cx="16" cy="24" r="4" fill="var(--card)"/><circle cx="48" cy="24" r="4" fill="var(--card)"/></svg>`;
    return `<svg viewBox="0 0 64 30" ${f}><path d="M2 22V3h38v19z"/><path d="M40 9h12l8 7v6H40"/><circle cx="12" cy="24" r="4" fill="var(--card)"/><circle cx="50" cy="24" r="4" fill="var(--card)"/></svg>`;
  };

  // ---- State -------------------------------------------------------------
  const fresh = () => ({
    screen: 'home', kind: null, size: null, from: null, to: null, typing: null, query: '', when: null,

    if (!s.size || !s.from || !s.to) return null;
    const z = SIZES.find((x) => x.id === s.size), d = km(s.from, s.to);

  };

  // ---- Pieces --------------------------------------------------------------
  const cell = (label, value, key, s, wide) => `<div class="wb-cell${wide ? ' wb-route' : ''}">${wide ? value : `<div class="label">${label}</div><div class="v${value ? '' : ' empty'}${s.fresh === key ? ' fresh' : ''}">${value ? esc(value) : '—'}</div>`}</div>`;
  const waybill = (s) => {
    const kind = KINDS.find((k) => k.id === s.kind), size = SIZES.find((x) => x.id === s.size), q = quote(s);
    const route = `<div style="min-width:0;flex:1"><div class="label">From</div><div class="v${s.from ? '' : ' empty'}${s.fresh === 'route' ? ' fresh' : ''}">${s.from ? esc(s.from.n + ', ' + s.from.c) : '—'}</div></div><span class="arrow">→</span><div style="min-width:0;flex:1"><div class="label">To</div><div class="v${s.to ? '' : ' empty'}${s.fresh === 'route' ? ' fresh' : ''}">${s.to ? esc(s.to.n + ', ' + s.to.c) : '—'}</div></div>`;

  };

  const mapSvg = (s, h, opts = {}) => {
    const pts = [s.from, s.to].filter(Boolean);

    const all = opts.focus || [...pts, ...extra];
    if (!all.length) return '';
    let minLat = Math.min(...all.map((p) => p.lat)), maxLat = Math.max(...all.map((p) => p.lat));
    let minLng = Math.min(...all.map((p) => p.lng)), maxLng = Math.max(...all.map((p) => p.lng));

    const W = 390;
    const x = (p) => ((p.lng - minLng) / (maxLng - minLng)) * (W - 60) + 30;
    const y = (p) => h - (((p.lat - minLat) / (maxLat - minLat)) * (h - 70) + 30);
    let grid = '';
    for (let i = 0; i < W; i += 26) grid += `<path d="M${i} 0V${h}" stroke="var(--map-grid)"/>`;

    const radar = opts.radar && s.from ? `<circle cx="${x(s.from)}" cy="${y(s.from)}" r="26" fill="var(--route)" class="pulse"/>` : '';

  const screens = {
    home: (s) => `<div class="screen"><div class="scroll">

        <button class="cta" data-go="what" style="position:relative">Start a waybill ${ic('arrow', 18)}</button>
      </div>
      <div class="howto"><div><b>1 · Describe</b>What and how big</div><div><b>2 · Price</b>You set it, drivers offer</div><div><b>3 · Book</b>Pay cash on delivery</div></div>
      <div class="label">Last time</div>
      <button class="recent" data-repeat="1"><span><b>Maarif → Agdal, Rabat</b><br><span class="note">Furniture · Van · 780 DH · Delivered</span></span><span class="ghost" style="pointer-events:none">Again</span></button>
    </div></div>`,

    what: (s) => `<div class="screen">${bar(1, 'home')}<div class="scroll">${waybill(s)}
      <h2>What are you sending?</h2>
      <div class="tiles">${KINDS.map((k) => `<button class="tile" data-kind="${k.id}" aria-pressed="${s.kind === k.id}">${ic(k.icon)}${k.t}</button>`).join('')}</div>
      <div class="label">How big is it?</div>
      <div class="sizes">${SIZES.map((z) => `<button class="size" data-size="${z.id}" aria-pressed="${s.size === z.id}">${vehicleArt(z.id)}<span><span class="t">${z.t}</span><br><span class="d">${z.d}</span></span></button>`).join('')}</div>
      <button class="ghost" data-toast="Photos: the app reads them and fills this in for you." style="align-self:flex-start">${ic('camera', 18)} Or show us a photo</button>
    </div><div class="foot"><button class="cta" data-go="where" ${s.kind && s.size ? '' : 'disabled'}>Next: where to ${ic('arrow', 18)}</button></div></div>`,

    where: (s) => {
      const q = s.query.trim().toLowerCase();
      const list = s.typing ? PLACES.filter((p) => !q || (p.n + ' ' + p.c).toLowerCase().includes(q)).filter((p) => p !== (s.typing === 'from' ? s.to : s.from)).slice(0, 5) : [];
      const field = (key, color, ph) => `<div class="field" style="${s.typing === key ? 'border-color:var(--ink)' : ''}"><span class="dot" style="background:${color}"></span><input id="f-${key}" placeholder="${ph}" value="${esc(s.typing === key ? s.query : s[key] ? s[key].n + ', ' + s[key].c : '')}" autocomplete="off"></div>`;
      return `<div class="screen">${bar(2, 'what')}<div class="scroll">${waybill(s)}
        <h2>Where and when?</h2>
        ${field('from', 'var(--ink)', 'Pickup address')}
        ${s.typing === 'from' ? `<div class="sugg">${list.map((p) => `<button data-place="${PLACES.indexOf(p)}">${esc(p.n)}<span>${esc(p.c)}</span></button>`).join('')}</div>` : ''}
        ${field('to', 'var(--stamp)', 'Drop-off address')}
        ${s.typing === 'to' ? `<div class="sugg">${list.map((p) => `<button data-place="${PLACES.indexOf(p)}">${esc(p.n)}<span>${esc(p.c)}</span></button>`).join('')}</div>` : ''}
        ${s.from && s.to && !s.typing ? `<div class="map" style="height:130px;border-radius:14px;overflow:hidden">${mapSvg(s, 130)}</div>` : ''}
        <div class="label">Pickup</div>
        <div class="chips">${WHEN.map((w) => `<button class="chip" data-when="${esc(w)}" aria-pressed="${s.when === w}">${w}</button>`).join('')}</div>
      </div><div class="foot"><button class="cta" data-go="price" ${s.from && s.to && s.when ? '' : 'disabled'}>Next: your price ${ic('arrow', 18)}</button></div></div>`;
    },

    price: (s) => {
      const q = quote(s), p = s.price || q.mid;
      const pos = Math.max(0, Math.min(1, (p - q.low * 0.7) / (q.high * 1.2 - q.low * 0.7)));
      const verdict = p < q.low ? ['var(--stamp)', 'Low: few drivers will take it'] : p < q.mid ? ['var(--signal)', 'Fair: offers may take a little longer'] : ['var(--ok)', 'Good: most drivers will offer'];
      return `<div class="screen">${bar(3, 'where')}<div class="scroll">${waybill({ ...s, price: p })}
        <h2>What will you pay?</h2>
        <p class="sub">${q.km} km, ${SIZES.find((z) => z.id === s.size).veh.toLowerCase()}. Similar trips go for <b>${dh(q.low)} to ${dh(q.high)}</b>.</p>
        <div class="price-big mono" aria-live="polite">${p.toLocaleString('fr-FR').replace(/ /g, ' ')}<small>DH</small></div>
        <div class="meter-wrap">
          <div class="meter"><span style="position:absolute;left:calc(${pos * 100}% - 7px);top:-5px;width:14px;height:20px;border-radius:5px;background:var(--ink);border:2px solid var(--card)"></span></div>
          <input id="price" type="range" min="${r10(q.low * 0.7)}" max="${r10(q.high * 1.2)}" step="10" value="${p}" aria-label="Your price">
        </div>
        <div class="verdict"><i style="background:${verdict[0]}"></i>${verdict[1]}</div>
        <p class="note" style="text-align:center">Cash to the driver on delivery. Helpers and floors: tell the driver in the chat.</p>
      </div><div class="foot"><button class="cta" data-post="1">Send to drivers · ${dh(p)}</button></div></div>`;
    },

    offers: (s) => {
      const drivers = s.offers.filter((o) => o.state !== 'declined').map((o) => ({ lat: o.lat, lng: o.lng, label: dh(o.price).replace(' DH', '') }));
      const live = s.offers.filter((o) => o.state !== 'declined');
      return `<div class="screen"><div class="map" style="height:300px">${mapSvg(s, 300, { radar: !live.length, drivers, focus: drivers.length ? [s.from, ...drivers] : null })}
        <div class="map-tag"><span class="live"></span>${live.length ? `${live.length} offer${live.length > 1 ? 's' : ''}` : 'Finding drivers near you'}</div></div>
        <div class="sheet"><div class="scroll" style="padding-top:18px">
          <div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="label">Your price</div><div style="font-family:var(--display);font-stretch:80%;font-weight:800;font-size:22px">${dh(s.price)}</div></div><button class="ghost" data-go="price">Change</button><button class="ghost" data-cancel="1" style="color:var(--stamp)">Cancel</button></div>
          ${live.length ? '' : `<div class="empty-wait"><b style="color:var(--ink)">Your waybill is out</b>Drivers within 15 km see it now. The first offers usually come in under 2 minutes.</div>`}
          ${live.map((o) => offerCard(o, s)).join('')}
        </div></div></div>`;
    },

    booked: (s) => {
      const o = s.booked;
      const steps = [
        ['Booked', `${o.name} accepted ${dh(o.price)}`],
        ['On the way to you', `${o.away} min away`],
        ['Loading', 'At your pickup'],
        ['On the road', `${quote(s).km} km to ${s.to.n}`],
        ['Delivered', 'Pay in cash, then rate'],
      ];
      const t = Math.min(s.track, steps.length - 1);
      const truckAt = t <= 2 ? s.from : t === 3 ? { lat: (s.from.lat + s.to.lat) / 2, lng: (s.from.lng + s.to.lng) / 2 } : s.to;
      return `<div class="screen"><div class="map" style="height:200px">${mapSvg(s, 200, { truck: truckAt })}<div class="map-tag"><span class="live"></span>${steps[t][0]}</div></div>
        <div class="sheet"><div class="scroll" style="padding-top:18px">
          ${waybill(s)}
          <div class="driver"><div class="avatar">${o.name[0]}</div><div style="flex:1"><b>${esc(o.name)}</b><div class="note">★ ${o.r} · ${o.trips} trips · ${SIZES.find((z) => z.id === s.size).veh}</div></div>
            <button class="icon-btn" data-toast="Calling inside the app: nobody sees your number." aria-label="Call">${ic('phone', 18)}</button><button class="icon-btn" data-toast="Chat opens here: send photos, the floor, the gate code." aria-label="Message">${ic('chat', 18)}</button></div>
          <div class="track">${steps.map((st, i) => `<div class="tstep ${i < t ? 'done' : i === t ? (t === steps.length - 1 ? 'done' : 'now') : 'todo'}"><span class="b"></span><div><div class="tt">${st[0]}</div>${i <= t ? `<div class="td">${st[1]}</div>` : ''}</div></div>`).join('')}</div>
          ${t === steps.length - 1 ? `<div style="text-align:center;display:flex;flex-direction:column;gap:6px"><b>How was ${esc(o.name.split(' ')[0])}?</b><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-star="${n}" class="${n <= s.stars ? 'on' : ''}" aria-label="${n} stars">★</button>`).join('')}</div>${s.stars ? '<button class="cta" data-new="1">Send something else</button>' : ''}</div>` : ''}
        </div></div></div>`;
    },
  };

  const offerCard = (o, s) => {
    const diff = o.price - s.price;
    const top = `<div class="offer-row"><div class="avatar">${o.name[0]}</div><div><div class="name">${esc(o.name)}</div><div class="meta">★ ${o.r} · ${o.trips} trips · ${o.away} min away</div></div>
      <div class="p">${dh(o.price)}<small>${o.state === 'agreed' ? 'took your price' : diff === 0 ? 'your price' : (diff > 0 ? '+' : '−') + dh(Math.abs(diff))}</small></div></div>`;
    if (o.state === 'waiting') return `<div class="offer">${top}<div class="note">You offered ${dh(o.counter)}. Waiting for ${esc(o.name.split(' ')[0])}.</div></div>`;
    if (S.counterOpen === o.id && s === S) return `<div class="offer">${top}<div class="counter"><button class="round" data-cstep="-10" aria-label="Lower">−</button><div class="val mono">${dh(S.counterVal)}</div><button class="round" data-cstep="10" aria-label="Higher">+</button></div><div class="acts"><button class="ghost" data-cclose="1">Back</button><button class="accept" data-csend="${o.id}">Offer ${dh(S.counterVal)}</button></div></div>`;
    return `<div class="offer">${top}${o.state === 'kept' ? `<div class="note">${esc(o.name.split(' ')[0])} keeps his price.</div>` : ''}<div class="acts"><button class="ghost" data-counter="${o.id}">Counter</button><button class="accept" data-accept="${o.id}">Accept ${dh(o.price)}</button></div></div>`;
  };

  // ---- Render & events ---------------------------------------------------------
  const root = document.getElementById('root');
  let view = 'try';
  function render() {
    if (view === 'all') return renderAll();
    const focusId = document.activeElement && document.activeElement.id;
    const caret = document.activeElement && document.activeElement.selectionStart;
    root.innerHTML = `<div class="phone">${screens[S.screen](S)}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}</div>`;
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
    S.fresh = null;
  }
  const set = (patch) => { S = { ...S, ...patch }; render(); };
  const toast = (text) => { set({ toast: text }); later(() => set({ toast: null }), 2600); };

  function post() {
    const q = quote(S);
    set({ screen: 'offers', price: S.price || q.mid, offers: [] });
    DRIVERS.forEach((d, i) => later(() => {
      const ang = i * 2.1 + 0.6, dist = 0.025 + i * 0.008;
      const o = { id: 'o' + i, name: d.n, r: d.r, trips: d.trips, away: d.away, agree: d.agree, price: r10(S.price * d.f), state: 'open', lat: S.from.lat + Math.sin(ang) * dist, lng: S.from.lng + Math.cos(ang) * dist * 1.2 };
      set({ offers: [...S.offers, o] });
    }, 1800 + i * 2300));
  }
  const updOffer = (id, patch) => set({ offers: S.offers.map((o) => (o.id === id ? { ...o, ...patch } : o)) });

  root.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || view !== 'try') return;
    const d = b.dataset;
    if (d.go) { if (d.go === 'price' && S.screen === 'offers') { clearTimers(); set({ screen: 'price', offers: [] }); } else set({ screen: d.go, typing: null }); }
    else if (d.kind) set({ kind: d.kind, fresh: 'kind' });
    else if (d.size) set({ size: d.size, fresh: 'size' });
    else if (d.when) set({ when: d.when, fresh: 'when' });
    else if (d.place) { const p = PLACES[+d.place]; set({ [S.typing]: p, typing: null, query: '', fresh: 'route' }); }
    else if (d.post) post();
    else if (d.cancel) { clearTimers(); set({ screen: 'price', offers: [] }); toast('Request cancelled. Nothing is charged.'); }
    else if (d.counter) { const o = S.offers.find((x) => x.id === d.counter); set({ counterOpen: o.id, counterVal: r10(Math.min(o.price, S.price) * 0.95) }); }
    else if (d.cstep) set({ counterVal: Math.max(10, S.counterVal + +d.cstep) });
    else if (d.cclose) set({ counterOpen: null });
    else if (d.csend) {
      const o = S.offers.find((x) => x.id === d.csend), val = S.counterVal;
      set({ counterOpen: null }); updOffer(o.id, { state: 'waiting', counter: val });
      later(() => updOffer(o.id, o.agree ? { state: 'agreed', price: val } : { state: 'kept' }), 2400);
    }
    else if (d.accept) {
      clearTimers();
      const o = S.offers.find((x) => x.id === d.accept);
      set({ screen: 'booked', booked: o, price: o.price, track: 0, fresh: 'price' });
      [1, 2, 3, 4].forEach((n) => later(() => set({ track: n }), n * 3500));
    }
    else if (d.star) set({ stars: +d.star });
    else if (d.new) { clearTimers(); S = fresh(); render(); }
    else if (d.repeat) set({ screen: 'what', kind: 'furniture', size: 'van', from: PLACES[0], to: PLACES[5], when: null, fresh: 'kind' });
    else if (d.toast) toast(d.toast);
  });
  root.addEventListener('focusin', (e) => {
    if (view !== 'try' || !e.target.id || !e.target.id.startsWith('f-')) return;
    const key = e.target.id.slice(2);
    if (S.typing !== key) set({ typing: key, query: '' });
  });
  root.addEventListener('input', (e) => {
    if (e.target.id === 'price') set({ price: +e.target.value, fresh: null });
    else if (e.target.id && e.target.id.startsWith('f-')) set({ query: e.target.value });
  });

  // ---- All screens -------------------------------------------------------------
  function sample(patch) {
    const base = { ...fresh(), kind: 'furniture', size: 'van', from: PLACES[0], to: PLACES[5], when: 'Tomorrow, morning' };
    const q = quote(base);
    return { ...base, price: q.mid, ...patch };
  }
  function renderAll() {
    const s3 = sample({});
    const offers = DRIVERS.map((d, i) => ({ id: 'o' + i, name: d.n, r: d.r, trips: d.trips, away: d.away, price: r10(s3.price * d.f), state: i === 0 ? 'agreed' : 'open', lat: s3.from.lat + Math.sin(i * 2.1 + .6) * (0.025 + i * 0.008), lng: s3.from.lng + Math.cos(i * 2.1 + .6) * (0.025 + i * 0.008) * 1.2 }));
    const list = [
      ['Home', 'One clear start. Last trip can be repeated in one tap.', screens.home(fresh())],
      ['1 · What', 'Pick the goods, then the size by what it fits in. The waybill fills in at the top.', screens.what(sample({ from: null, to: null, when: null, price: null }))],
      ['2 · Where and when', 'Two addresses with suggestions, the trip on a small map, and a pickup time.', screens.where(sample({ price: null }))],
      ['3 · Your price', 'One slider. The bar shows how likely drivers are to accept.', screens.price(s3)],
      ['Offers', 'The map shows drivers and their prices. Accept, or counter with your own price.', screens.offers({ ...s3, offers })],
      ['Booked', 'The waybill is stamped. One timeline, the driver, call and chat.', screens.booked({ ...s3, booked: offers[0], price: offers[0].price, track: 3 })],
    ];
    root.innerHTML = `<div class="gallery">${list.map(([t, d, html]) => `<figure><div class="phone">${html}</div><figcaption><b>${t}</b>${d}</figcaption></figure>`).join('')}</div>`;
  }

  const views = { try: document.getElementById('v-try'), all: document.getElementById('v-all') };
  Object.entries(views).forEach(([k, el]) => el.addEventListener('click', () => {
    view = k; views.try.setAttribute('aria-pressed', k === 'try'); views.all.setAttribute('aria-pressed', k === 'all'); render();
  }));

  const BACK = { what: 'home', where: 'what', price: 'where', offers: 'price', booked: 'home' };
  window.appBack = () => {
    if (S.toast) { set({ toast: null }); return true; }
    if (S.typing) { set({ typing: null }); return true; }
    if (S.counterOpen) { set({ counterOpen: null }); return true; }
    const to = BACK[S.screen];
    if (!to) return false;
    clearTimers();
    if (S.screen === 'booked') { S = fresh(); render(); } else set({ screen: to, offers: S.screen === 'offers' ? [] : S.offers });
    return true;
  };
  render();
})();
</script>
</body></html>
